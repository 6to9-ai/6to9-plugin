name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  generated-files-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated files match guide/agent-guide.md
        run: python scripts/generate.py --check
      - name: Unit tests
        run: python -m unittest discover tests
      - name: Release guard - plugin version bump
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          python3 scripts/check_version_bump.py "$BASE"
      - name: JSON manifests parse
        run: |
          python -c "import json; [json.load(open(p)) for p in ['.claude-plugin/marketplace.json', 'plugins/6to9/.claude-plugin/plugin.json', 'clients/cursor/mcp.json']]"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace manifest
        run: claude plugin validate .
      - name: Validate plugin manifest
        run: claude plugin validate plugins/6to9
